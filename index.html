<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orb Landing Page</title>

    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #0f0d14;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* ==============================
           HERO
        ============================== */

        .hero {
            position: relative;

            width: 100%;
            height: 100vh;

            min-height: 600px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #0f0d14;
        }


        /* ==============================
           ORB
        ============================== */

        .orb-wrapper {
            position: absolute;

            width: 650px;
            height: 650px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 1;

            pointer-events: auto;
        }

        #orbCanvas {
            display: block;

            width: 100%;
            height: 100%;
        }


        /* ==============================
           CONTENT
        ============================== */

        .hero-content {
            position: relative;

            z-index: 5;

            width: 100%;
            max-width: 750px;

            padding: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            pointer-events: none;
        }


        /* ==============================
           BADGE
        ============================== */

        .badge {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 5px 14px 5px 5px;

            border: 1px solid rgba(255, 255, 255, 0.14);

            border-radius: 999px;

            background: rgba(15, 13, 20, 0.65);

            backdrop-filter: blur(10px);

            margin-bottom: 30px;

            font-size: 14px;

            color: #999;

            box-shadow:
                0 5px 30px rgba(0, 0, 0, 0.2);
        }


        .badge-new {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 7px 13px;

            border-radius: 999px;

            background: white;

            color: #111;

            font-size: 13px;

            font-weight: 700;
        }


        .badge-text {
            padding-right: 2px;
        }


        /* ==============================
           HEADING
        ============================== */

        .hero h1 {
            max-width: 680px;

            color: white;

            font-size: clamp(42px, 5.5vw, 68px);

            line-height: 1.04;

            font-weight: 700;

            letter-spacing: -2.8px;

            text-shadow:
                0 3px 20px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(15, 13, 20, 0.6);
        }


        /* ==============================
           BUTTONS
        ============================== */

        .buttons {
            display: flex;

            gap: 15px;

            margin-top: 40px;

            pointer-events: auto;
        }


        .btn {
            display: flex;

            align-items: center;
            justify-content: center;

            height: 50px;

            min-width: 135px;

            padding: 0 24px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 600;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }


        .btn-primary {
            background: white;

            color: #111;

            border: 1px solid white;
        }


        .btn-secondary {
            color: #aaa;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.13);

            backdrop-filter: blur(10px);
        }


        .btn:hover {
            transform: translateY(-2px);
        }


        .btn-primary:hover {
            background: #eeeeee;
        }


        .btn-secondary:hover {
            color: white;

            background: rgba(255, 255, 255, 0.08);

            border-color: rgba(255, 255, 255, 0.25);
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 800px) {

            .orb-wrapper {
                width: 600px;
                height: 600px;
            }

            .hero h1 {
                font-size: 48px;
                letter-spacing: -2px;
            }
        }


        @media (max-width: 600px) {

            .orb-wrapper {
                width: 500px;
                height: 500px;
            }

            .hero h1 {
                font-size: 38px;
                letter-spacing: -1.5px;
            }

            .badge {
                margin-bottom: 25px;
            }

            .buttons {
                gap: 10px;
                margin-top: 30px;
            }

            .btn {
                min-width: 120px;
                height: 48px;
                padding: 0 18px;
                font-size: 14px;
            }
        }

    </style>
</head>


<body>

    <!-- =================================
         HERO
    ================================== -->

    <main class="hero">

        <!-- Orb -->
        <div class="orb-wrapper" id="orbContainer">
            <canvas id="orbCanvas"></canvas>
        </div>


        <!-- Content -->
        <section class="hero-content">

            <div class="badge">

                <span class="badge-new">
                    NEW
                </span>

                <span class="badge-text">
                    Just shipped v2.0
                </span>

            </div>


            <h1>
                This orb is hiding<br>
                something, try hovering!
            </h1>


            <div class="buttons">

                <a href="#" class="btn btn-primary">
                    Get started
                </a>

                <a href="#" class="btn btn-secondary">
                    Learn more
                </a>

            </div>

        </section>

    </main>


    <!-- =================================
         WEBGL ORB
    ================================== -->

    <script>

        const canvas =
            document.getElementById("orbCanvas");

        const container =
            document.getElementById("orbContainer");


        const gl =
            canvas.getContext("webgl", {
                alpha: true,
                premultipliedAlpha: false
            });


        if (!gl) {
            alert("Your browser does not support WebGL.");
            throw new Error("WebGL not supported");
        }


        /* ==============================
           SETTINGS
        ============================== */

        const settings = {

            hue: 0,

            hoverIntensity: 2,

            rotateOnHover: true,

            forceHoverState: false,

            backgroundColor: "#0f0d14"

        };


        /* ==============================
           VERTEX SHADER
        ============================== */

        const vertexShaderSource = `

            precision highp float;

            attribute vec2 position;
            attribute vec2 uv;

            varying vec2 vUv;

            void main() {

                vUv = uv;

                gl_Position =
                    vec4(position, 0.0, 1.0);
            }

        `;


        /* ==============================
           FRAGMENT SHADER
        ============================== */

        const fragmentShaderSource = `

            precision highp float;

            uniform float iTime;
            uniform vec3 iResolution;

            uniform float hue;
            uniform float hover;
            uniform float rot;
            uniform float hoverIntensity;

            uniform vec3 backgroundColor;

            varying vec2 vUv;


            vec3 rgb2yiq(vec3 c) {

                float y = dot(
                    c,
                    vec3(
                        0.299,
                        0.587,
                        0.114
                    )
                );

                float i = dot(
                    c,
                    vec3(
                        0.596,
                        -0.274,
                        -0.322
                    )
                );

                float q = dot(
                    c,
                    vec3(
                        0.211,
                        -0.523,
                        0.312
                    )
                );

                return vec3(y, i, q);
            }


            vec3 yiq2rgb(vec3 c) {

                float r =
                    c.x +
                    0.956 * c.y +
                    0.621 * c.z;

                float g =
                    c.x -
                    0.272 * c.y -
                    0.647 * c.z;

                float b =
                    c.x -
                    1.106 * c.y +
                    1.703 * c.z;

                return vec3(r, g, b);
            }


            vec3 adjustHue(
                vec3 color,
                float hueDeg
            ) {

                float hueRad =
                    hueDeg *
                    3.14159265 /
                    180.0;

                vec3 yiq =
                    rgb2yiq(color);

                float cosA =
                    cos(hueRad);

                float sinA =
                    sin(hueRad);

                float i =
                    yiq.y * cosA -
                    yiq.z * sinA;

                float q =
                    yiq.y * sinA +
                    yiq.z * cosA;

                yiq.y = i;
                yiq.z = q;

                return yiq2rgb(yiq);
            }


            vec3 hash33(vec3 p3) {

                p3 =
                    fract(
                        p3 *
                        vec3(
                            0.1031,
                            0.11369,
                            0.13787
                        )
                    );

                p3 +=
                    dot(
                        p3,
                        p3.yxz + 19.19
                    );

                return -1.0 +
                    2.0 *
                    fract(
                        vec3(
                            p3.x + p3.y,
                            p3.x + p3.z,
                            p3.y + p3.z
                        ) *
                        p3.zyx
                    );
            }


            float snoise3(vec3 p) {

                const float K1 =
                    0.333333333;

                const float K2 =
                    0.166666667;

                vec3 i =
                    floor(
                        p +
                        (p.x + p.y + p.z) *
                        K1
                    );

                vec3 d0 =
                    p -
                    (
                        i -
                        (i.x + i.y + i.z) *
                        K2
                    );

                vec3 e =
                    step(
                        vec3(0.0),
                        d0 - d0.yzx
                    );

                vec3 i1 =
                    e *
                    (1.0 - e.zxy);

                vec3 i2 =
                    1.0 -
                    e.zxy *
                    (1.0 - e);

                vec3 d1 =
                    d0 -
                    (i1 - K2);

                vec3 d2 =
                    d0 -
                    (i2 - K1);

                vec3 d3 =
                    d0 - 0.5;

                vec4 h =
                    max(
                        0.6 -
                        vec4(
                            dot(d0, d0),
                            dot(d1, d1),
                            dot(d2, d2),
                            dot(d3, d3)
                        ),
                        0.0
                    );

                vec4 n =
                    h * h * h * h *
                    vec4(
                        dot(d0, hash33(i)),
                        dot(d1, hash33(i + i1)),
                        dot(d2, hash33(i + i2)),
                        dot(d3, hash33(i + 1.0))
                    );

                return dot(
                    vec4(31.316),
                    n
                );
            }


            vec4 extractAlpha(vec3 colorIn) {

                float a =
                    max(
                        max(
                            colorIn.r,
                            colorIn.g
                        ),
                        colorIn.b
                    );

                return vec4(
                    colorIn.rgb /
                    (a + 1e-5),
                    a
                );
            }


            const vec3 baseColor1 =
                vec3(
                    0.611765,
                    0.262745,
                    0.996078
                );


            const vec3 baseColor2 =
                vec3(
                    0.298039,
                    0.760784,
                    0.913725
                );


            const vec3 baseColor3 =
                vec3(
                    0.062745,
                    0.078431,
                    0.600000
                );


            const float innerRadius = 0.6;

            const float noiseScale = 0.65;


            float light1(
                float intensity,
                float attenuation,
                float dist
            ) {

                return intensity /
                    (
                        1.0 +
                        dist * attenuation
                    );
            }


            float light2(
                float intensity,
                float attenuation,
                float dist
            ) {

                return intensity /
                    (
                        1.0 +
                        dist * dist * attenuation
                    );
            }


            vec4 draw(vec2 uv) {

                vec3 color1 =
                    adjustHue(
                        baseColor1,
                        hue
                    );

                vec3 color2 =
                    adjustHue(
                        baseColor2,
                        hue
                    );

                vec3 color3 =
                    adjustHue(
                        baseColor3,
                        hue
                    );


                float ang =
                    atan(
                        uv.y,
                        uv.x
                    );

                float len =
                    length(uv);

                float invLen =
                    len > 0.0
                        ? 1.0 / len
                        : 0.0;


                float bgLuminance =
                    dot(
                        backgroundColor,
                        vec3(
                            0.299,
                            0.587,
                            0.114
                        )
                    );


                float n0 =
                    snoise3(
                        vec3(
                            uv * noiseScale,
                            iTime * 0.5
                        )
                    ) *
                    0.5 +
                    0.5;


                float r0 =
                    mix(
                        mix(
                            innerRadius,
                            1.0,
                            0.4
                        ),
                        mix(
                            innerRadius,
                            1.0,
                            0.6
                        ),
                        n0
                    );


                float d0 =
                    distance(
                        uv,
                        (r0 * invLen) * uv
                    );


                float v0 =
                    light1(
                        1.0,
                        10.0,
                        d0
                    );


                v0 *=
                    smoothstep(
                        r0 * 1.05,
                        r0,
                        len
                    );


                float innerFade =
                    smoothstep(
                        r0 * 0.8,
                        r0 * 0.95,
                        len
                    );


                v0 *=
                    mix(
                        innerFade,
                        1.0,
                        bgLuminance * 0.7
                    );


                float cl =
                    cos(
                        ang +
                        iTime * 2.0
                    ) *
                    0.5 +
                    0.5;


                float a =
                    iTime * -1.0;


                vec2 pos =
                    vec2(
                        cos(a),
                        sin(a)
                    ) *
                    r0;


                float d =
                    distance(
                        uv,
                        pos
                    );


                float v1 =
                    light2(
                        1.5,
                        5.0,
                        d
                    );


                v1 *=
                    light1(
                        1.0,
                        50.0,
                        d0
                    );


                float v2 =
                    smoothstep(
                        1.0,
                        mix(
                            innerRadius,
                            1.0,
                            n0 * 0.5
                        ),
                        len
                    );


                float v3 =
                    smoothstep(
                        innerRadius,
                        mix(
                            innerRadius,
                            1.0,
                            0.5
                        ),
                        len
                    );


                vec3 colBase =
                    mix(
                        color1,
                        color2,
                        cl
                    );


                float fadeAmount =
                    mix(
                        1.0,
                        0.1,
                        bgLuminance
                    );


                vec3 darkCol =
                    mix(
                        color3,
                        colBase,
                        v0
                    );


                darkCol =
                    (darkCol + v1) *
                    v2 *
                    v3;


                darkCol =
                    clamp(
                        darkCol,
                        0.0,
                        1.0
                    );


                vec3 lightCol =
                    (colBase + v1) *
                    mix(
                        1.0,
                        v2 * v3,
                        fadeAmount
                    );


                lightCol =
                    mix(
                        backgroundColor,
                        lightCol,
                        v0
                    );


                lightCol =
                    clamp(
                        lightCol,
                        0.0,
                        1.0
                    );


                vec3 finalCol =
                    mix(
                        darkCol,
                        lightCol,
                        bgLuminance
                    );


                return extractAlpha(finalCol);
            }


            vec4 mainImage(vec2 fragCoord) {

                vec2 center =
                    iResolution.xy * 0.5;


                float size =
                    min(
                        iResolution.x,
                        iResolution.y
                    );


                vec2 uv =
                    (fragCoord - center) /
                    size *
                    2.0;


                float angle = rot;

                float s = sin(angle);
                float c = cos(angle);


                uv =
                    vec2(
                        c * uv.x - s * uv.y,
                        s * uv.x + c * uv.y
                    );


                uv.x +=
                    hover *
                    hoverIntensity *
                    0.1 *
                    sin(
                        uv.y * 10.0 +
                        iTime
                    );


                uv.y +=
                    hover *
                    hoverIntensity *
                    0.1 *
                    sin(
                        uv.x * 10.0 +
                        iTime
                    );


                return draw(uv);
            }


            void main() {

                vec2 fragCoord =
                    vUv *
                    iResolution.xy;


                vec4 col =
                    mainImage(
                        fragCoord
                    );


                gl_FragColor =
                    vec4(
                        col.rgb * col.a,
                        col.a
                    );
            }

        `;


        /* ==============================
           SHADER CREATION
        ============================== */

        function createShader(type, source) {

            const shader =
                gl.createShader(type);

            gl.shaderSource(
                shader,
                source
            );

            gl.compileShader(shader);

            if (
                !gl.getShaderParameter(
                    shader,
                    gl.COMPILE_STATUS
                )
            ) {

                console.error(
                    gl.getShaderInfoLog(shader)
                );

                throw new Error(
                    "Shader compilation failed"
                );
            }

            return shader;
        }


        function createProgram() {

            const vertexShader =
                createShader(
                    gl.VERTEX_SHADER,
                    vertexShaderSource
                );


            const fragmentShader =
                createShader(
                    gl.FRAGMENT_SHADER,
                    fragmentShaderSource
                );


            const program =
                gl.createProgram();


            gl.attachShader(
                program,
                vertexShader
            );

            gl.attachShader(
                program,
                fragmentShader
            );


            gl.linkProgram(program);


            if (
                !gl.getProgramParameter(
                    program,
                    gl.LINK_STATUS
                )
            ) {

                throw new Error(
                    gl.getProgramInfoLog(program)
                );
            }


            return program;
        }


        const program =
            createProgram();


        gl.useProgram(program);


        /* ==============================
           FULL SCREEN TRIANGLE
        ============================== */

        const vertices =
            new Float32Array([
                -1, -1,
                 3, -1,
                -1,  3
            ]);


        const positionBuffer =
            gl.createBuffer();


        gl.bindBuffer(
            gl.ARRAY_BUFFER,
            positionBuffer
        );


        gl.bufferData(
            gl.ARRAY_BUFFER,
            vertices,
            gl.STATIC_DRAW
        );


        const position =
            gl.getAttribLocation(
                program,
                "position"
            );


        gl.enableVertexAttribArray(
            position
        );


        gl.vertexAttribPointer(
            position,
            2,
            gl.FLOAT,
            false,
            0,
            0
        );


        /* ==============================
           UV
        ============================== */

        const uvs =
            new Float32Array([
                0, 0,
                2, 0,
                0, 2
            ]);


        const uvBuffer =
            gl.createBuffer();


        gl.bindBuffer(
            gl.ARRAY_BUFFER,
            uvBuffer
        );


        gl.bufferData(
            gl.ARRAY_BUFFER,
            uvs,
            gl.STATIC_DRAW
        );


        const uv =
            gl.getAttribLocation(
                program,
                "uv"
            );


        gl.enableVertexAttribArray(uv);


        gl.vertexAttribPointer(
            uv,
            2,
            gl.FLOAT,
            false,
            0,
            0
        );


        /* ==============================
           UNIFORMS
        ============================== */

        const iTime =
            gl.getUniformLocation(
                program,
                "iTime"
            );


        const iResolution =
            gl.getUniformLocation(
                program,
                "iResolution"
            );


        const hue =
            gl.getUniformLocation(
                program,
                "hue"
            );


        const hover =
            gl.getUniformLocation(
                program,
                "hover"
            );


        const rot =
            gl.getUniformLocation(
                program,
                "rot"
            );


        const hoverIntensity =
            gl.getUniformLocation(
                program,
                "hoverIntensity"
            );


        const backgroundColor =
            gl.getUniformLocation(
                program,
                "backgroundColor"
            );


        /* ==============================
           BACKGROUND COLOR
        ============================== */

        function hexToRgb(hex) {

            hex =
                hex.replace("#", "");

            return [

                parseInt(
                    hex.substring(0, 2),
                    16
                ) / 255,

                parseInt(
                    hex.substring(2, 4),
                    16
                ) / 255,

                parseInt(
                    hex.substring(4, 6),
                    16
                ) / 255

            ];
        }


        const bg =
            hexToRgb(
                settings.backgroundColor
            );


        /* ==============================
           RESIZE
        ============================== */

        function resize() {

            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            const width =
                container.clientWidth;


            const height =
                container.clientHeight;


            canvas.width =
                width * dpr;


            canvas.height =
                height * dpr;


            canvas.style.width =
                width + "px";


            canvas.style.height =
                height + "px";


            gl.viewport(
                0,
                0,
                canvas.width,
                canvas.height
            );


            gl.uniform3f(
                iResolution,
                canvas.width,
                canvas.height,
                canvas.width /
                canvas.height
            );
        }


        window.addEventListener(
            "resize",
            resize
        );


        resize();


        /* ==============================
           HOVER
        ============================== */

        let targetHover = 0;

        let currentHover = 0;

        let currentRotation = 0;

        let lastTime = 0;

        const rotationSpeed = 0.3;


        container.addEventListener(
            "mousemove",
            function(event) {

                const rect =
                    container.getBoundingClientRect();


                const x =
                    event.clientX -
                    rect.left;


                const y =
                    event.clientY -
                    rect.top;


                const size =
                    Math.min(
                        rect.width,
                        rect.height
                    );


                const centerX =
                    rect.width / 2;


                const centerY =
                    rect.height / 2;


                const uvX =
                    ((x - centerX) /
                        size) *
                    2;


                const uvY =
                    ((y - centerY) /
                        size) *
                    2;


                const distance =
                    Math.sqrt(
                        uvX * uvX +
                        uvY * uvY
                    );


                targetHover =
                    distance < 0.8
                        ? 1
                        : 0;
            }
        );


        container.addEventListener(
            "mouseleave",
            function() {

                targetHover = 0;

            }
        );


        /* ==============================
           ANIMATION
        ============================== */

        function animate(time) {

            requestAnimationFrame(
                animate
            );


            const dt =
                lastTime === 0
                    ? 0
                    : (time - lastTime) *
                      0.001;


            lastTime = time;


            gl.uniform1f(
                iTime,
                time * 0.001
            );


            gl.uniform1f(
                hue,
                settings.hue
            );


            gl.uniform1f(
                hoverIntensity,
                settings.hoverIntensity
            );


            const effectiveHover =
                settings.forceHoverState
                    ? 1
                    : targetHover;


            currentHover +=
                (
                    effectiveHover -
                    currentHover
                ) * 0.1;


            gl.uniform1f(
                hover,
                currentHover
            );


            if (
                settings.rotateOnHover &&
                effectiveHover > 0.5
            ) {

                currentRotation +=
                    dt *
                    rotationSpeed;
            }


            gl.uniform1f(
                rot,
                currentRotation
            );


            gl.uniform3f(
                backgroundColor,
                bg[0],
                bg[1],
                bg[2]
            );


            gl.clearColor(
                0,
                0,
                0,
                0
            );


            gl.clear(
                gl.COLOR_BUFFER_BIT
            );


            gl.drawArrays(
                gl.TRIANGLES,
                0,
                3
            );
        }


        requestAnimationFrame(
            animate
        );

    </script>

</body>

</html>
